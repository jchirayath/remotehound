# RemoteHound bundle: RemoteHound + Apache Guacamole (+ optional Caddy TLS and
# Vector log collection). One command:   docker compose up -d
#
#   browser ──https──► caddy ──► remotehound ──(/guacamole proxy)──► guacamole ──► guacd
#   device  ──ssh -R──────────► remotehound:2222        guacd ──► remotehound tunnel ports
#
# Only 80/443 (caddy) and the SSH tunnel port are published. guacamole and
# guacd live on the internal `guac` network with no route out, and the tunnel
# listeners bind ONLY on remotehound's address on that network (RH_TUNNEL_BIND),
# so a device's desktop is reachable by guacd and nothing else.
#
# Profiles:
#   (default)  remotehound, guacamole, guacd, caddy
#   logs       + vector: every container's stdout into one JSONL file the
#                Logs screen shows as source=bundle (needs the Docker socket,
#                read-only — enable only if you accept that).
#   control    + rh-control: Start/Stop/Restart and container logs on the
#                Services screen. The helper holds the Docker socket (root on
#                the host) so RemoteHound never does; it acts only on the
#                containers labelled io.remotehound.control.* below. Also set
#                RH_CONTROL_URL and RH_CONTROL_TOKEN in .env.
#
# Without Caddy (you already run a proxy): remove the caddy service and publish
# remotehound's 8080 to your proxy; set RH_TRUSTED_PROXIES to the proxy's address.

name: remotehound

services:
  remotehound:
    image: ghcr.io/jchirayath/remotehound:${REMOTEHOUND_VERSION:-latest}
    build:
      context: ..
      args:
        VERSION: ${REMOTEHOUND_VERSION:-0.1.0-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      RH_HTTP_ADDR: ":8080"
      RH_SSH_ADDR: ":2222"
      RH_METRICS_ADDR: ":9090"           # internal only: not published
      RH_TUNNEL_BIND: "172.30.0.10"      # the guac-network address below
      RH_TUNNEL_ADVERTISE_HOST: "172.30.0.10"
      RH_DATA_DIR: /data
      RH_RECORDINGS_DIR: /recordings
      RH_GUAC_RECORDING_PATH: /recordings
      RH_GUAC_URL: http://guacamole:8080/guacamole
      RH_GUACD_ADDR: guacd:4822
      RH_TRUSTED_PROXIES: ${RH_TRUSTED_PROXIES:-172.29.0.0/24}
      RH_BUNDLE_LOG: /bundle-logs/bundle.jsonl
    ports:
      - "${RH_SSH_PUBLISH:-2222}:2222"   # devices dial this
    volumes:
      - rh-data:/data
      - recordings:/recordings
      - bundle-logs:/bundle-logs        # rw: retention caps the file at 100 MB
    networks:
      edge:
        ipv4_address: 172.29.0.10
      guac:
        ipv4_address: 172.30.0.10
      control: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      guacamole:
        condition: service_started
    labels:
      # rh-control may restart RemoteHound and read its logs — never stop it
      # (RemoteHound refuses that too: no console would be left to start it).
      io.remotehound.control.service: remotehound
      io.remotehound.control.actions: restart,logs
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  guacamole:
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    restart: unless-stopped
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${RH_GUAC_JSON_SECRET:?set RH_GUAC_JSON_SECRET in .env (remotehound gen-secret)}
      # WEBAPP_CONTEXT left at its default (/guacamole) — RH_GUAC_URL and
      # RH_GUAC_PUBLIC_PATH must match it.
    networks: [guac]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [guacd]
    labels:
      io.remotehound.control.service: guacamole
      io.remotehound.control.actions: start,stop,restart,logs
    logging: *logging

  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    volumes:
      - recordings:/recordings
    networks: [guac]
    # guacd parses hostile RDP/VNC/SSH from enrolled devices: no capabilities,
    # read-only root, scratch space in tmpfs.
    cap_drop: [ALL]
    read_only: true
    # /home/guacd must be writable or FreeRDP warns "initialization may fail"
    # (it keeps per-user config there) — in memory, owned by the guacd user.
    tmpfs: ["/tmp", "/home/guacd:uid=1000,gid=1000,mode=0700"]
    security_opt: ["no-new-privileges:true"]
    labels:
      io.remotehound.control.service: guacd
      io.remotehound.control.actions: start,stop,restart,logs
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      RH_DOMAIN: ${RH_DOMAIN:?set RH_DOMAIN in .env, e.g. rh.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.29.0.2
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [remotehound]
    logging: *logging

  rh-control:
    profiles: [control]
    image: ghcr.io/jchirayath/remotehound:${REMOTEHOUND_VERSION:-latest}
    command: ["control"]
    restart: unless-stopped
    environment:
      RH_CONTROL_LISTEN: ":9091"
      RH_CONTROL_DOCKER_SOCKET: /var/run/docker.sock
      RH_CONTROL_TOKEN: ${RH_CONTROL_TOKEN:-}   # the helper refuses to start without it
    # Non-root, in the socket's group only. The socket is still root-equivalent:
    # what limits the helper is its code (labelled containers, listed actions)
    # and that nothing but remotehound can reach it.
    user: "65532:${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]   # internal, shared with remotehound only; no ports
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/remotehound", "control-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  vector:
    profiles: [logs]
    image: timberio/vector:0.51.1-alpine@sha256:2d16ae87ec395508366f3c064899d374fbe04de6e64c3a613ed64aedbee034b4
    restart: unless-stopped
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bundle-logs:/bundle-logs
    command: ["--config", "/etc/vector/vector.toml"]
    network_mode: none
    logging: *logging

networks:
  edge:
    ipam:
      config: [{ subnet: 172.29.0.0/24 }]
  guac:
    internal: true          # no route to the internet
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  control:
    internal: true          # remotehound <-> rh-control only

volumes:
  rh-data:        # state, audit log, SSH host key — BACK THIS UP (docs/RUNBOOK.md)
  recordings:     # session recordings (guacd writes, remotehound lists/downloads/prunes)
  bundle-logs:
  caddy-data:
  caddy-config:
