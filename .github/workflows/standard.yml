# Engineering standard gate (§7.1): tokens, generated-code drift, site build scan, TEST-7 map, banned-API lint.
# Installed by engineering-standard/bin/adopt.sh; repo-owned after that (add your stack's tests and scanners).
name: standard
on: [push, pull_request]
permissions: { contents: read }
jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install semgrep==1.180.0
      - run: tools/standard/check.sh
        env: { CI: "true" }
