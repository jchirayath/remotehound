# Build and test gates (§7.1). Actions are pinned to commit SHAs (SEC-17).
name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  secrets:
    # Whole-history secret scan + owner-data/secret-file check (the same as .githooks/pre-commit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node ci/check-public.mjs
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --config /repo/.gitleaks.toml
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e    # v7.0.0
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -run=^$ -fuzz=FuzzOpen -fuzztime=20s ./internal/guac/
      - run: go test -run=^$ -fuzz=FuzzParseAgentCommand -fuzztime=20s ./internal/tunnel/
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: ./ci/guards.sh
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node --test web/ui/tests/*.test.mjs   # Node 22 does not accept a directory here
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y dash zsh
      - run: sh client/test/run.sh
  e2e:
    # Browser journeys + walkthroughs (e2e/) against the real bundle built from this commit,
    # with the TEST-ONLY sign-in overlay. Everything listens on the runner's loopback only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: sh deploy/test/make-env.sh
      # Build both images with Docker layer caching (GitHub Actions cache), tagged as compose names
      # them, so `compose up` below starts them without building. The patched Guacamole image only
      # changes with its Dockerfile; the RemoteHound image reuses its base image and Go modules.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/jchirayath/remotehound:latest
          cache-from: type=gha,scope=remotehound
          cache-to: type=gha,scope=remotehound,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: deploy/guacamole
          load: true
          tags: rh-guacamole:1.6.0
          cache-from: type=gha,scope=rh-guacamole
          cache-to: type=gha,scope=rh-guacamole,mode=max
      - name: Start the test bundle
        working-directory: deploy
        run: DOCKER_GID="$(stat -c %g /var/run/docker.sock)" docker compose -f compose.yml -f test/compose.e2e.yml --env-file test/e2e.env up -d --wait
      - name: Wait until every Guacamole hop passes
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost:8443/api/v1/integration | grep -q '"overall":"pass"' && exit 0
            sleep 3
          done
          curl -sk https://localhost:8443/api/v1/integration; exit 1
      - working-directory: e2e
        run: npm ci --ignore-scripts
      - working-directory: e2e
        run: npx playwright test
      - name: Bundle logs
        if: failure()
        working-directory: deploy
        run: mkdir -p ../e2e/test-results && docker compose -f compose.yml -f test/compose.e2e.yml --env-file test/e2e.env logs --no-color > ../e2e/test-results/bundle.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with: { name: e2e-results, path: e2e/test-results, retention-days: 7 }
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t remotehound:ci .
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 image --exit-code 1 --severity CRITICAL,HIGH remotehound:ci
